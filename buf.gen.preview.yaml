# gen/go is the canonical Go output; the deterministic sync script re-homes it
# onto agent-sdk-go (rewrites the go_package module path). Kept for `buf
# generate` sanity checks / previews.
version: v2
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es
    out: gen/es
    opt: target=ts
  - remote: buf.build/protocolbuffers/dart
    out: gen/dart
  - remote: buf.build/connectrpc/dart
    out: gen/dart
  - remote: buf.build/protocolbuffers/java
    out: gen/kotlin
    opt: lite
  - remote: buf.build/protocolbuffers/kotlin
    out: gen/kotlin
    opt: lite
  - remote: buf.build/connectrpc/kotlin
    out: gen/kotlin
  - remote: buf.build/apple/swift
    out: gen/swift
    opt: Visibility=Public
  - remote: buf.build/connectrpc/swift
    out: gen/swift
    opt: Visibility=Public
