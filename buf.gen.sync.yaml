# Native buf output consumed by scripts/sync-agent-sdks.sh.
# All paths are placeholders: the script overrides the destination with
# `--output <staging>`, then rewrites the Go module path to agent-sdk-go.
# Kept file-local (not the repo root) since it is only ever run with --template.
version: v2
managed:
  enabled: true
  override:
    - file_option: java_package_prefix
      value: com
    - file_option: java_multiple_files
      value: true
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es
    out: gen/es
    opt: target=ts
  - remote: buf.build/protocolbuffers/dart
    out: gen/dart
  - remote: buf.build/connectrpc/dart
    out: gen/dart
  - remote: buf.build/protocolbuffers/java
    out: gen/kotlin
    opt: lite
  - remote: buf.build/protocolbuffers/kotlin
    out: gen/kotlin
    opt: lite
  - remote: buf.build/connectrpc/kotlin
    out: gen/kotlin
  - remote: buf.build/apple/swift
    out: gen/swift
    opt: Visibility=Public
  - remote: buf.build/connectrpc/swift
    out: gen/swift
    opt: Visibility=Public
